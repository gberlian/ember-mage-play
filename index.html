<script>
  // Everyone joins the shared town (?solo plays alone; an explicit ?connect=... wins). The page
  // server relays /ws to the game server; copies hosted elsewhere join the public server.
  // Phones and tablets (or ?touch) get the touch layer: set before any other script reads it.
  if (new URLSearchParams(location.search).has("touch") || matchMedia("(pointer: coarse)").matches) document.documentElement.classList.add("touch");
  (() => { const q = new URLSearchParams(location.search);
    if (!q.has("solo") && !q.has("connect") && location.protocol.startsWith("http")) {
      const own = location.port === "10000" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
      q.set("connect", own ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
        : "wss://galaxy.tail9445e0.ts.net:10000/ws");
      history.replaceState(null, "", location.pathname + "?" + q.toString().replace(/%3A/g, ":").replace(/%2F/g, "/") + location.hash);
    } })();
</script>

<div id="load"><div><b>RUNECRAFT</b><div id="msg">Loading the world...</div><div id="bar"><i></i></div><div style="opacity:.7;margin-top:10px">Click to look around, WASD to move, mouse to cast</div></div></div>
<script type="module">
  const bar = document.querySelector("#bar i"), msg = document.getElementById("msg");
  let p = 5; const tick = setInterval(() => { p = Math.min(92, p + (95 - p) * 0.04); bar.style.width = p + "%"; }, 200);
  // The game sets data-status on <body> once its first frame is drawn.
  const seen = new MutationObserver(() => {
    if (!document.body.dataset.status) return;
    clearInterval(tick); seen.disconnect(); document.getElementById("load")?.remove();
  });
  seen.observe(document.body, { attributes: true });
  // Pointer lock must be requested inside the click; the game reads document.pointerLockElement.
  const canvas = document.getElementById("game3d"), play = document.getElementById("play");
  const lock = () => { canvas.focus(); if (document.pointerLockElement === canvas) return;
    try { canvas.requestPointerLock({ unadjustedMovement: true })?.catch?.(() => { try { canvas.requestPointerLock()?.catch?.(drag); } catch { drag(); } }); } catch { drag(); } };
  // pointerdown, in the capture phase: the game's own pointerdown handler calls preventDefault,
  // which stops the browser from sending mousedown at all.
  // Phones and tablets (or ?touch): no pointer lock; the touch layer below steers instead.
  const touch = document.documentElement.classList.contains("touch");
  document.addEventListener("pointerdown", (e) => { if (!touch && (e.target === canvas || e.target === play)) lock(); }, { capture: true });
  // Inside a frame that refuses pointer lock (the X timeline), the game turns the camera while a
  // button or finger is held and dragged instead: <body data-drag="1">.
  const framed = window.self !== window.top || new URLSearchParams(location.search).has("embed");
  const drag = () => { if (framed) document.body.dataset.drag = "1"; sync(); };
  // Coming from the poster (?embed) the poster click already started the game: no second Play button;
  // the next click on the game locks the pointer.
  const fromPoster = new URLSearchParams(location.search).has("embed");
  const sync = () => { play.hidden = touch || fromPoster || document.pointerLockElement === canvas || !document.body.dataset.status || document.body.dataset.drag === "1"; };
  document.addEventListener("pointerlockchange", sync);
  document.addEventListener("pointerlockerror", drag);
  new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["data-status"] });
  const m = await import("./pkg-bfa8004-dirty/mage.js");
  m.default({ module_or_path: "./pkg-bfa8004-dirty/mage_bg.wasm" }).catch((e) => {
    if (!String(e).includes("Using exceptions for control flow")) { msg.textContent = "Could not start: " + e; console.error(e); }
  });
</script>

<style>

<script>
  // Controls card: shown for the first 25 s of play, H toggles it.
  (() => { const k = document.getElementById("keys"); let timer = 0;
    const started = () => { if (k.dataset.shown) return; k.dataset.shown = "1"; k.hidden = false; timer = setTimeout(() => { k.hidden = true; }, 25000); };
    document.addEventListener("pointerdown", started, { capture: true });
    addEventListener("keydown", (e) => { if (e.code === "KeyH" && e.target.tagName !== "INPUT") { clearTimeout(timer); k.hidden = !k.hidden; } });
  })();
</script>

<script>
  // Touch layer: the joystick and buttons list what is held in <body data-touch="..."> and the game
  // presses those keys (crates/client/src/mage/touch.rs). Fingers on the open screen turn the camera.
  (() => { if (!document.documentElement.classList.contains("touch")) return;
    const held = new Map(); let move = [];
    const publish = () => { document.body.dataset.touch = [...move, ...held.values()].join(" "); };
    for (const b of document.querySelectorAll("#btns b")) {
      const down = (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); held.set(e.pointerId, b.dataset.k); b.classList.add("on"); publish(); };
      const up = (e) => { if (held.get(e.pointerId) !== b.dataset.k) return; held.delete(e.pointerId); b.classList.remove("on"); publish(); };
      b.addEventListener("pointerdown", down);
      for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(t, up);
    }
    const stick = document.getElementById("stick"), knob = stick.querySelector("i"); let id = null;
    const steer = (e) => { const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy; const max = r.width / 2, len = Math.hypot(dx, dy);
      if (len > max) { dx *= max / len; dy *= max / len; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      const t = max * 0.35; move = [];
      if (dy < -t) move.push("KeyW"); if (dy > t) move.push("KeyS"); if (dx < -t) move.push("KeyA"); if (dx > t) move.push("KeyD");
      if (len > max * 0.95 && dy < -t) move.push("ShiftLeft");
      publish(); };
    stick.addEventListener("pointerdown", (e) => { e.preventDefault(); id = e.pointerId; stick.setPointerCapture?.(id); steer(e); });
    stick.addEventListener("pointermove", (e) => { if (e.pointerId === id) steer(e); });
    for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) stick.addEventListener(t, (e) => { if (e.pointerId !== id) return; id = null; move = []; knob.style.transform = ""; publish(); });
  })();
</script>
<button id="fresh" hidden>New version · Reload</button>
<style>
  #fresh { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 8px 16px; border: 1px solid #ffb34799; border-radius: 999px; background: #1a1424e6; color: #ffd9a0; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; z-index: 10; }
  #fresh[hidden] { display: none; }
</style>
<script>
  // A newer deploy than the running build shows a one-tap reload (version.json is written by
  // tools/build-web.sh; fetched uncached at start and every 60 s).
  (() => { const mine = document.querySelector('meta[name="build"]')?.content, b = document.getElementById("fresh");
    if (!mine) return;
    const check = () => fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json())
      .then((v) => { if (v.build && v.build !== mine) b.hidden = false; }).catch(() => {});
    b.onclick = () => { const q = new URLSearchParams(location.search); q.set("v", Date.now()); location.search = q.toString(); };
    check(); setInterval(check, 60000);
  })();
</script>
<div id="live" hidden></div>
<form id="fb"><button type="button" id="fbopen" aria-label="Feedback">✎</button><input id="fbtext" maxlength="500" placeholder="Feedback" hidden><button id="fbsend" hidden>Send</button></form>
<style>
  #live { position: fixed; top: 10px; right: 12px; padding: 4px 10px; border-radius: 999px; background: #0008; color: #fff; font: 600 13px system-ui, sans-serif; pointer-events: none; }
  #live::before { content: "● "; color: #5f5; }
  #fb { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; font: 14px system-ui, sans-serif; }
  #fb button, #fb input { border: 1px solid #fff6; border-radius: 999px; background: #000a; color: #fff; padding: 7px 12px; font: inherit; }
  #fb input { width: min(60vw, 340px); outline: none; }
</style>
<script>
  // Live player count and a one-line feedback box (tools/serve-web.ts stores it).
  (() => {
    let id = ""; try { id = localStorage.getItem("rc-id") || ""; } catch {}
    if (!/^[a-z0-9]{8,32}$/.test(id)) { id = Math.random().toString(36).slice(2, 14).padEnd(8, "0"); try { localStorage.setItem("rc-id", id); } catch {} }
    // On a static copy (GitHub Pages) the count and feedback go to the game's own server.
    const api = location.hostname.endsWith("github.io") ? "https://galaxy.tail9445e0.ts.net:10000/api/" : "api/";
    const live = document.getElementById("live");
    const ping = () => fetch(api + "live?id=" + id).then((r) => r.json()).then((d) => { live.textContent = d.playing; live.hidden = false; }).catch(() => {});
    ping(); setInterval(ping, 20000);
    const form = document.getElementById("fb"), open = document.getElementById("fbopen"), text = document.getElementById("fbtext"), send = document.getElementById("fbsend");
    const show = (on) => { text.hidden = send.hidden = !on; if (on) { document.exitPointerLock?.(); text.focus(); } };
    open.onclick = () => show(text.hidden);
    for (const t of ["keydown", "keyup", "keypress"]) text.addEventListener(t, (e) => { e.stopPropagation(); if (t === "keydown" && e.key === "Escape") show(false); });
    form.onsubmit = (e) => { e.preventDefault(); const v = text.value.trim(); if (!v) return;
      fetch(api + "feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, text: v }) })
        .then((r) => r.json()).then((d) => { if (d.ok) { text.value = ""; text.placeholder = "Thanks"; show(false); } }).catch(() => {}); };
  })();
</script>

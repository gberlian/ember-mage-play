<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Mage</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; }
  #go { all: unset; position: fixed; inset: 0; cursor: pointer; background: url(poster-480.jpg) center / cover no-repeat; }
  #go span { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px; border-radius: 50%; background: #1a1424cc; border: 2px solid #fff8; }
  #go span::after { content: ""; position: absolute; left: 33px; top: 24px; border-style: solid; border-width: 18px 0 18px 28px; border-color: transparent transparent transparent #fff; }
  #go:hover span { background: #2a1f3acc; }
</style>
</head>
<body>
<button id="go" aria-label="Play"><span></span></button>
<script>
  // The X timeline shows this page in a small sandboxed frame: the poster first, the game on a tap.
  document.getElementById("go").addEventListener("click", () => { location.href = "./?embed=1"; });
</script>
</body>
</html>
